<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WebAR Artwork Experience</title>

    <!-- Safe Camera Fallback for Laptops/Desktops without Rear Camera -->
    <script>
      (function() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const originalGUM = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
          navigator.mediaDevices.getUserMedia = async function(constraints) {
            try {
              return await originalGUM(constraints);
            } catch (err) {
              console.warn('[AR Camera] Primary constraint failed, attempting generic video fallback:', err);
              return await originalGUM({ audio: false, video: true });
            }
          };
        }
      })();
    </script>

    <!-- A-Frame 1.4.2 (Officially paired & tested with MindAR 1.2.5) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <!-- MindAR Image Tracking for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000 !important;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      }

      /* Hide default A-Frame VR buttons and standard MindAR default UI */
      .a-enter-vr, .a-enter-ar { display: none !important; }
      .mindar-ui-overlay { display: none !important; }
      .mindar-ui-loading { display: none !important; }
      .mindar-ui-scanning { display: none !important; }

      /* Never show raw HTML video tags inside a-assets in the DOM */
      a-assets video, video[id^="artwork-video"] {
        display: none !important;
      }

      /* MindAR Camera Feed styling */
      body > video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        z-index: 0 !important;
      }

      /* Transparent A-Frame Canvas sitting directly over camera video */
      a-scene canvas.a-canvas {
        background: transparent !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 1 !important;
      }

      /* Fullscreen Loading & Permission Shield */
      #ar-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        color: #fff;
        padding: 24px;
        text-align: center;
        transition: opacity 0.4s ease-out, visibility 0.4s;
      }

      #ar-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .spinner-ring {
        width: 56px;
        height: 56px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #ffffff;
        border-right-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #ffffff;
      }

      .loader-sub {
        font-size: 13px;
        color: #94a3b8;
        max-width: 320px;
        line-height: 1.5;
        margin-bottom: 16px;
      }

      .loader-badge {
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        padding: 6px 16px;
        color: #f1f5f9;
        margin-bottom: 16px;
      }

      .btn-start {
        background: #ffffff;
        color: #04121d;
        font-size: 15px;
        font-weight: 700;
        padding: 12px 28px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .btn-start:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 25px rgba(255, 255, 255, 0.4);
      }

      .btn-new-tab {
        margin-top: 14px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid #334155;
        color: #94a3b8;
        font-size: 12px;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .btn-new-tab:hover {
        color: #e2e8f0;
        background: rgba(255, 255, 255, 0.12);
      }

      /* Minimal Viewfinder Reticle */
      #scanning-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.3s ease;
      }

      #scanning-hud.hidden {
        opacity: 0;
      }

      .hud-frame {
        position: relative;
        width: min(72vw, 290px);
        height: min(72vw, 290px);
        border: 1px dashed rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hud-corner {
        position: absolute;
        width: 22px;
        height: 22px;
        border-color: #007C94;
        border-style: solid;
      }
      .hud-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-top-left-radius: 8px; }
      .hud-tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-top-right-radius: 8px; }
      .hud-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-bottom-left-radius: 8px; }
      .hud-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-bottom-right-radius: 8px; }

      .hud-laser {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #23BFBC, transparent);
        box-shadow: 0 0 10px #23BFBC;
        animation: scanSweep 2.4s ease-in-out infinite alternate;
      }

      @keyframes scanSweep {
        0% { top: 8%; opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { top: 92%; opacity: 0.2; }
      }

      .hud-text {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: #f8fafc;
        background: rgba(15, 23, 42, 0.85);
        padding: 8px 18px;
        border-radius: 999px;
        margin-top: 24px;
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Audio Status Badge */
      #audio-badge {
        position: fixed;
        bottom: 24px;
        right: 20px;
        z-index: 1001;
        background: rgba(15, 23, 42, 0.88);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.22);
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        backdrop-filter: blur(10px);
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* Alignment Calibration Panel */
      #align-badge {
        position: fixed;
        bottom: 24px;
        left: 20px;
        z-index: 1001;
        background: rgba(15, 23, 42, 0.88);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.22);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        backdrop-filter: blur(10px);
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #align-badge:active { transform: scale(0.96); }

      .align-drawer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-width: 480px;
        margin: 0 auto;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-bottom: none;
        border-radius: 20px 20px 0 0;
        padding: 16px 20px 24px;
        z-index: 1002;
        backdrop-filter: blur(16px);
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7);
        transform: translateY(115%);
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
      }
      .align-drawer.open {
        transform: translateY(0);
      }
      .align-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .align-close-btn {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: #94a3b8;
        font-size: 16px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .align-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px;
        border-radius: 10px;
      }
      .align-tab {
        flex: 1;
        background: transparent;
        border: none;
        color: #94a3b8;
        padding: 6px 8px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .align-tab.active {
        background: #007C94;
        color: #ffffff;
      }
      .control-row {
        margin-bottom: 12px;
      }
      .control-row label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 500;
        color: #cbd5e1;
        margin-bottom: 4px;
      }
      .control-row input[type="range"] {
        width: 100%;
        accent-color: #23BFBC;
        height: 6px;
        background: #334155;
        border-radius: 3px;
        outline: none;
      }
      .ratio-btn-group {
        display: flex;
        gap: 6px;
      }
      .ratio-btn {
        flex: 1;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #cbd5e1;
        padding: 6px 4px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .ratio-btn.active {
        background: rgba(35, 191, 188, 0.2);
        border-color: #23BFBC;
        color: #23BFBC;
      }
      .btn-subtle {
        flex: 1;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #94a3b8;
        padding: 9px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary {
        flex: 1;
        background: #007C94;
        border: none;
        color: #ffffff;
        padding: 9px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Visual Loading Screen & Fallback Activator -->
    <div id="ar-loader">
      <div class="spinner-ring" id="loader-spinner"></div>
      <div class="loader-title" id="loader-title">Starting Camera</div>
      <div class="loader-sub" id="loader-sub">Initializing live camera stream & optical target features...</div>
      <div class="loader-badge" id="loader-status">Requesting Camera Access</div>
      <button class="btn-start" id="start-ar-btn" style="display: none;">
        <span>📷 Tap to Start Camera</span>
      </button>
      <a class="btn-new-tab" id="open-new-tab-btn" href="./standalone.html" target="_blank" rel="noopener noreferrer" style="display: none;">
        <span>↗ Open in New Window</span>
      </a>
    </div>

    <!-- Minimal Viewfinder Reticle HUD -->
    <div id="scanning-hud">
      <div class="hud-frame">
        <div class="hud-corner hud-tl"></div>
        <div class="hud-corner hud-tr"></div>
        <div class="hud-corner hud-bl"></div>
        <div class="hud-corner hud-br"></div>
        <div class="hud-laser"></div>
      </div>
      <div class="hud-text">
        <span style="font-size: 13px;">✦</span>
        <span>Align Artwork in Frame</span>
      </div>
    </div>

    <!-- Alignment Toggle & Sound Toggle Badges -->
    <div id="align-badge">📐 Adjust Alignment</div>
    <div id="audio-badge">🔈 Sound Muted (Tap for Sound)</div>

    <!-- Alignment Drawer Modal -->
    <div id="align-panel" class="align-drawer">
      <div class="align-header">
        <span style="font-weight: 700; font-size: 14px; color: #f8fafc;">📐 Video Alignment & Scale</span>
        <button id="close-align-btn" class="align-close-btn" type="button">✕</button>
      </div>

      <div class="align-tabs">
        <button class="align-tab active" data-target="0" type="button">Artwork 1</button>
        <button class="align-tab" data-target="1" type="button">Artwork 2</button>
        <button class="align-tab" data-target="2" type="button">Artwork 3</button>
      </div>

      <div class="align-controls">
        <div class="control-row">
          <label>Scale / Size: <span id="val-scale">1.00x</span></label>
          <input type="range" id="slider-scale" min="0.4" max="1.8" step="0.02" value="1.0" />
        </div>

        <div class="control-row">
          <label>Horizontal Position (X): <span id="val-x">0.00</span></label>
          <input type="range" id="slider-x" min="-0.6" max="0.6" step="0.01" value="0.0" />
        </div>

        <div class="control-row">
          <label>Vertical Position (Y): <span id="val-y">0.00</span></label>
          <input type="range" id="slider-y" min="-0.6" max="0.6" step="0.01" value="0.0" />
        </div>

        <div class="control-row">
          <label>Shape / Ratio:</label>
          <div class="ratio-btn-group">
            <button class="ratio-btn active" data-ratio="1.7778" type="button">16:9 Widescreen</button>
            <button class="ratio-btn" data-ratio="1.3333" type="button">4:3 Full Poster</button>
            <button class="ratio-btn" data-ratio="1.0000" type="button">1:1 Square</button>
          </div>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 12px;">
          <button id="reset-align-btn" class="btn-subtle" type="button">Reset Target</button>
          <button id="save-align-btn" class="btn-primary" type="button">Done</button>
        </div>
      </div>
    </div>

    <!-- A-Frame WebAR Scene with MindAR Tracking -->
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.02; warmupTolerance: 3; missTolerance: 6; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      style="position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1;"
    >
      <a-assets timeout="10000">
        <!-- Artwork 1 Video Overlay -->
        <video
          id="artwork-video"
          src="./assets/my-video.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          x5-playsinline
          muted
          crossorigin="anonymous"
        ></video>

        <!-- Artwork 2 Video Overlay -->
        <video
          id="artwork-video-2"
          src="./assets/my-video2.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          x5-playsinline
          muted
          crossorigin="anonymous"
        ></video>

        <!-- Artwork 3 Video Overlay -->
        <video
          id="artwork-video-3"
          src="./assets/my-video3.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          x5-playsinline
          muted
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Anchor 1: First Physical Artwork (targetIndex: 0) -->
      <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
        <!-- Frame Border matching Artwork Ocean Teal (#007C94) -->
        <a-plane
          id="ar-video-border-1"
          position="0 0 -0.005"
          width="1.04"
          height="0.6025"
          color="#007C94"
          material="shader: flat; opacity: 0.95; transparent: true;"
        ></a-plane>

        <!-- Video Overlay Plane (MindAR target width = 1.0, 16:9 height = 0.5625) -->
        <a-video
          id="ar-video-plane"
          src="#artwork-video"
          position="0 0 0.002"
          height="0.5625"
          width="1.0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>

      <!-- Target Anchor 2: Second Physical Artwork (targetIndex: 1) -->
      <a-entity id="target-anchor-2" mindar-image-target="targetIndex: 1">
        <!-- Frame Border matching Artwork Ocean Teal (#007C94) -->
        <a-plane
          id="ar-video-border-2"
          position="0 0 -0.005"
          width="1.04"
          height="0.6025"
          color="#007C94"
          material="shader: flat; opacity: 0.95; transparent: true;"
        ></a-plane>

        <!-- Video Overlay Plane (MindAR target width = 1.0, 16:9 height = 0.5625) -->
        <a-video
          id="ar-video-plane-2"
          src="#artwork-video-2"
          position="0 0 0.002"
          height="0.5625"
          width="1.0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>

      <!-- Target Anchor 3: Third Physical Artwork (targetIndex: 2) -->
      <a-entity id="target-anchor-3" mindar-image-target="targetIndex: 2">
        <!-- Frame Border matching Artwork Ocean Teal (#007C94) -->
        <a-plane
          id="ar-video-border-3"
          position="0 0 -0.005"
          width="1.04"
          height="0.6025"
          color="#007C94"
          material="shader: flat; opacity: 0.95; transparent: true;"
        ></a-plane>

        <!-- Video Overlay Plane (MindAR target width = 1.0, 16:9 height = 0.5625) -->
        <a-video
          id="ar-video-plane-3"
          src="#artwork-video-3"
          position="0 0 0.002"
          height="0.5625"
          width="1.0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video1 = document.getElementById('artwork-video');
      const targetAnchor1 = document.getElementById('target-anchor');
      const videoPlane1 = document.getElementById('ar-video-plane');
      const border1 = document.getElementById('ar-video-border-1');

      const video2 = document.getElementById('artwork-video-2');
      const targetAnchor2 = document.getElementById('target-anchor-2');
      const videoPlane2 = document.getElementById('ar-video-plane-2');
      const border2 = document.getElementById('ar-video-border-2');

      const video3 = document.getElementById('artwork-video-3');
      const targetAnchor3 = document.getElementById('target-anchor-3');
      const videoPlane3 = document.getElementById('ar-video-plane-3');
      const border3 = document.getElementById('ar-video-border-3');

      const loader = document.getElementById('ar-loader');
      const loaderStatus = document.getElementById('loader-status');
      const loaderTitle = document.getElementById('loader-title');
      const loaderSub = document.getElementById('loader-sub');
      const loaderSpinner = document.getElementById('loader-spinner');
      const startArBtn = document.getElementById('start-ar-btn');
      const openNewTabBtn = document.getElementById('open-new-tab-btn');

      const hud = document.getElementById('scanning-hud');
      const audioBadge = document.getElementById('audio-badge');
      const scene = document.querySelector('a-scene');

      // FRAME BORDER COLOR: Exact match to your physical artwork's Ocean Teal border (#007C94)
      const FRAME_BORDER_COLOR = '#007C94';

      const targetPlanes = [videoPlane1, videoPlane2, videoPlane3];
      const targetBorders = [border1, border2, border3];
      const targetVideosList = [video1, video2, video3];

      // Default Alignment Configurations
      // MindAR standard: Target width in 3D world space is 1.0 unit.
      // Native 16:9 video height is 1.0 / 1.7778 = 0.5625 (no stretching or distortion).
      const DEFAULT_ALIGNMENTS = [
        { scale: 1.0, x: 0.0, y: 0.0, aspect: 1.7778 }, // Target 0 (Artwork 1)
        { scale: 1.0, x: 0.0, y: 0.0, aspect: 1.7778 }, // Target 1 (Artwork 2)
        { scale: 1.0, x: 0.0, y: 0.0, aspect: 1.7778 }  // Target 2 (Artwork 3)
      ];

      let alignments = JSON.parse(localStorage.getItem('mindar_alignment_v2') || 'null');
      if (!alignments || !Array.isArray(alignments) || alignments.length < 3) {
        alignments = JSON.parse(JSON.stringify(DEFAULT_ALIGNMENTS));
      }

      function applyAlignment(targetIdx) {
        const cfg = alignments[targetIdx];
        const vPlane = targetPlanes[targetIdx];
        const bPlane = targetBorders[targetIdx];
        if (!vPlane || !cfg) return;

        // Base width in MindAR is 1.0
        const width = +(1.0 * cfg.scale).toFixed(4);
        const height = +(width / cfg.aspect).toFixed(4);

        vPlane.setAttribute('position', `${cfg.x.toFixed(3)} ${cfg.y.toFixed(3)} 0.002`);
        vPlane.setAttribute('width', width);
        vPlane.setAttribute('height', height);

        if (bPlane) {
          const pad = 0.04 * cfg.scale;
          bPlane.setAttribute('position', `${cfg.x.toFixed(3)} ${cfg.y.toFixed(3)} -0.005`);
          bPlane.setAttribute('width', +(width + pad).toFixed(4));
          bPlane.setAttribute('height', +(height + pad).toFixed(4));
          bPlane.setAttribute('color', FRAME_BORDER_COLOR);
        }
      }

      // Initialize all 3 targets with correct, un-distorted dimensions
      [0, 1, 2].forEach(i => applyAlignment(i));

      // Auto-fit to video's native aspect ratio once metadata loads
      targetVideosList.forEach((videoEl, idx) => {
        if (!videoEl) return;
        const onMeta = () => {
          if (videoEl.videoWidth && videoEl.videoHeight) {
            const nativeAspect = videoEl.videoWidth / videoEl.videoHeight;
            // Update aspect ratio smoothly if around standard widescreen
            if (Math.abs(alignments[idx].aspect - 1.7778) < 0.02) {
              alignments[idx].aspect = +nativeAspect.toFixed(4);
              applyAlignment(idx);
            }
          }
        };
        videoEl.addEventListener('loadedmetadata', onMeta);
        if (videoEl.readyState >= 1) onMeta();
      });

      // Alignment Drawer UI Logic
      let selectedAlignTarget = 0;
      const alignBadge = document.getElementById('align-badge');
      const alignPanel = document.getElementById('align-panel');
      const closeAlignBtn = document.getElementById('close-align-btn');
      const saveAlignBtn = document.getElementById('save-align-btn');
      const resetAlignBtn = document.getElementById('reset-align-btn');

      const sliderScale = document.getElementById('slider-scale');
      const sliderX = document.getElementById('slider-x');
      const sliderY = document.getElementById('slider-y');
      const valScale = document.getElementById('val-scale');
      const valX = document.getElementById('val-x');
      const valY = document.getElementById('val-y');

      const alignTabs = document.querySelectorAll('.align-tab');
      const ratioBtns = document.querySelectorAll('.ratio-btn');

      function updateDrawerUI() {
        const cfg = alignments[selectedAlignTarget];
        if (!cfg) return;

        sliderScale.value = cfg.scale;
        valScale.innerText = `${cfg.scale.toFixed(2)}x`;

        sliderX.value = cfg.x;
        valX.innerText = cfg.x.toFixed(2);

        sliderY.value = cfg.y;
        valY.innerText = cfg.y.toFixed(2);

        ratioBtns.forEach(btn => {
          const r = parseFloat(btn.dataset.ratio);
          btn.classList.toggle('active', Math.abs(cfg.aspect - r) < 0.05);
        });

        alignTabs.forEach(tab => {
          tab.classList.toggle('active', parseInt(tab.dataset.target, 10) === selectedAlignTarget);
        });
      }

      if (alignBadge && alignPanel) {
        alignBadge.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirmedActiveTarget !== null && confirmedActiveTarget !== undefined) {
            selectedAlignTarget = confirmedActiveTarget;
          }
          updateDrawerUI();
          alignPanel.classList.add('open');
        });

        const closeDrawer = () => {
          alignPanel.classList.remove('open');
          localStorage.setItem('mindar_alignment_v2', JSON.stringify(alignments));
        };

        if (closeAlignBtn) closeAlignBtn.addEventListener('click', closeDrawer);
        if (saveAlignBtn) saveAlignBtn.addEventListener('click', closeDrawer);

        alignTabs.forEach(tab => {
          tab.addEventListener('click', () => {
            selectedAlignTarget = parseInt(tab.dataset.target, 10);
            updateDrawerUI();
          });
        });

        sliderScale.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          alignments[selectedAlignTarget].scale = val;
          valScale.innerText = `${val.toFixed(2)}x`;
          applyAlignment(selectedAlignTarget);
        });

        sliderX.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          alignments[selectedAlignTarget].x = val;
          valX.innerText = val.toFixed(2);
          applyAlignment(selectedAlignTarget);
        });

        sliderY.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          alignments[selectedAlignTarget].y = val;
          valY.innerText = val.toFixed(2);
          applyAlignment(selectedAlignTarget);
        });

        ratioBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            const r = parseFloat(btn.dataset.ratio);
            alignments[selectedAlignTarget].aspect = r;
            updateDrawerUI();
            applyAlignment(selectedAlignTarget);
          });
        });

        if (resetAlignBtn) {
          resetAlignBtn.addEventListener('click', () => {
            alignments[selectedAlignTarget] = JSON.parse(JSON.stringify(DEFAULT_ALIGNMENTS[selectedAlignTarget]));
            updateDrawerUI();
            applyAlignment(selectedAlignTarget);
            localStorage.setItem('mindar_alignment_v2', JSON.stringify(alignments));
          });
        }
      }

      // Dismiss Loader when AR is ready
      let isReadyDismissed = false;
      function dismissLoader() {
        if (isReadyDismissed) return;
        isReadyDismissed = true;
        if (loaderStatus) loaderStatus.innerText = '✓ AR Engine Ready';
        if (loader) loader.classList.add('loaded');
      }

      // Check if inside an iframe without camera delegation
      const isIframe = window.self !== window.top;
      if (isIframe && openNewTabBtn) {
        openNewTabBtn.style.display = 'inline-flex';
      }

      // Show manual start button if camera takes > 2.2 seconds (e.g. awaiting permission or gesture)
      const loaderTimeout = setTimeout(() => {
        if (!isReadyDismissed) {
          if (loaderSpinner) loaderSpinner.style.display = 'none';
          if (loaderTitle) loaderTitle.innerText = 'Start Camera';
          if (loaderSub) loaderSub.innerText = 'Tap below to grant camera access and start the AR experience.';
          if (startArBtn) startArBtn.style.display = 'inline-flex';
        }
      }, 2200);

      // Handle user gesture start button
      startArBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        startArBtn.disabled = true;
        startArBtn.innerText = 'Starting...';

        // Pre-unlock video playback
        [video1, video2, video3].forEach(v => {
          if (v) {
            v.muted = true;
            v.play().then(() => v.pause()).catch(() => {});
          }
        });

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: { ideal: "environment" } }
          });
          dismissLoader();
        } catch (err) {
          console.error('Camera request error:', err);
          if (loaderSub) loaderSub.innerText = 'Camera access was denied or unavailable. Please enable camera permissions in your browser.';
          if (openNewTabBtn) openNewTabBtn.style.display = 'inline-flex';
        }
      });

      // Bind AR readiness
      scene.addEventListener('arReady', () => {
        console.log('[AR Engine] arReady event fired!');
        clearTimeout(loaderTimeout);
        dismissLoader();
      });

      // Periodic check in case arReady fired before listener attached
      const readyPoller = setInterval(() => {
        const arSystem = scene ? scene.systems['mindar-image-system'] : null;
        if (arSystem && arSystem.controller) {
          clearInterval(readyPoller);
          clearTimeout(loaderTimeout);
          dismissLoader();
        }
      }, 300);

      // Handle arError
      scene.addEventListener('arError', (event) => {
        console.error('[AR Engine] arError event:', event);
        if (loaderSpinner) loaderSpinner.style.display = 'none';
        if (loaderTitle) loaderTitle.innerText = 'Camera Access Required';
        if (loaderSub) loaderSub.innerText = 'Camera stream could not start. Tap below to retry or launch in a direct browser tab.';
        if (startArBtn) {
          startArBtn.style.display = 'inline-flex';
          startArBtn.innerText = 'Retry Camera';
          startArBtn.disabled = false;
        }
        if (openNewTabBtn) openNewTabBtn.style.display = 'inline-flex';
      });

      // Centralized Target State Manager: Anti-Flash Target Stabilization
      const targetVideos = [video1, video2, video3];
      const videoPlanes = [videoPlane1, videoPlane2, videoPlane3];
      const borders = [border1, border2, border3];

      let confirmedActiveTarget = null; // null | 0 | 1 | 2
      let candidateTarget = null;
      let confirmationTimer = null;

      // Start with all 3D planes hidden until their specific target is confirmed
      videoPlanes.forEach(plane => { if (plane) plane.setAttribute('visible', 'false'); });
      borders.forEach(border => { if (border) border.setAttribute('visible', 'false'); });

      function activateTarget(targetIndex) {
        console.log(`[AR Engine] Confirmed & Activating Artwork ${targetIndex + 1}!`);
        confirmedActiveTarget = targetIndex;
        if (hud) hud.classList.add('hidden');

        targetVideos.forEach((vid, idx) => {
          if (!vid) return;
          if (idx === targetIndex) {
            // Make 3D plane and border visible
            if (videoPlanes[idx]) videoPlanes[idx].setAttribute('visible', 'true');
            if (borders[idx]) borders[idx].setAttribute('visible', 'true');

            vid.muted = isGlobalMuted;
            const playPromise = vid.play();
            if (playPromise !== undefined) {
              playPromise.catch((err) => {
                console.warn(`[AR Engine] Video ${idx + 1} play blocked by autoplay policy, retrying muted:`, err);
                vid.muted = true;
                vid.play().catch(e => console.error(`[AR Engine] Video ${idx + 1} playback error:`, e));
              });
            }
          } else {
            // Pause, rewind, and hide any other video plane
            vid.pause();
            vid.currentTime = 0;
            if (videoPlanes[idx]) videoPlanes[idx].setAttribute('visible', 'false');
            if (borders[idx]) borders[idx].setAttribute('visible', 'false');
          }
        });
      }

      function handleTargetFound(targetIndex) {
        console.log(`[AR Engine] Candidate detection for Artwork ${targetIndex + 1} (targetIndex: ${targetIndex})`);

        // If this artwork is ALREADY confirmed and playing, keep playing
        if (confirmedActiveTarget === targetIndex) return;

        // Register new candidate target
        candidateTarget = targetIndex;
        if (confirmationTimer) clearTimeout(confirmationTimer);

        // Confirmation stabilization buffer (220ms):
        // If Target 0 (Artwork 1) produces a momentary 50-100ms false trigger on the outer border
        // while you are scanning Artwork 2 or 3, Target 1 or 2 will take over before this timer fires.
        // This 100% guarantees Artwork 1's video NEVER starts playing on Artwork 2 or 3!
        confirmationTimer = setTimeout(() => {
          if (candidateTarget === targetIndex) {
            activateTarget(targetIndex);
          }
        }, 220);
      }

      function handleTargetLost(targetIndex) {
        console.log(`[AR Engine] Artwork ${targetIndex + 1} lost. targetIndex: ${targetIndex}`);

        // If this target was a pending candidate, cancel confirmation
        if (candidateTarget === targetIndex) {
          candidateTarget = null;
          if (confirmationTimer) clearTimeout(confirmationTimer);
        }

        // If this target was the confirmed active one, shut it down
        if (confirmedActiveTarget === targetIndex) {
          confirmedActiveTarget = null;
          if (targetVideos[targetIndex]) {
            targetVideos[targetIndex].pause();
            targetVideos[targetIndex].currentTime = 0;
          }
          if (videoPlanes[targetIndex]) videoPlanes[targetIndex].setAttribute('visible', 'false');
          if (borders[targetIndex]) borders[targetIndex].setAttribute('visible', 'false');

          setTimeout(() => {
            if (confirmedActiveTarget === null && candidateTarget === null) {
              if (hud) hud.classList.remove('hidden');
            }
          }, 200);
        }
      }

      // Bind Artwork 1 Events (targetIndex: 0 -> video 1)
      if (targetAnchor1) {
        targetAnchor1.addEventListener('targetFound', () => handleTargetFound(0));
        targetAnchor1.addEventListener('targetLost', () => handleTargetLost(0));
      }

      // Bind Artwork 2 Events (targetIndex: 1 -> video 2)
      if (targetAnchor2) {
        targetAnchor2.addEventListener('targetFound', () => handleTargetFound(1));
        targetAnchor2.addEventListener('targetLost', () => handleTargetLost(1));
      }

      // Bind Artwork 3 Events (targetIndex: 2 -> video 3)
      if (targetAnchor3) {
        targetAnchor3.addEventListener('targetFound', () => handleTargetFound(2));
        targetAnchor3.addEventListener('targetLost', () => handleTargetLost(2));
      }

      // Audio Toggle Controller
      let isGlobalMuted = true;
      function setMuteState(muted) {
        isGlobalMuted = muted;
        if (video1) video1.muted = muted;
        if (video2) video2.muted = muted;
        if (video3) video3.muted = muted;

        if (muted) {
          audioBadge.innerText = '🔈 Sound Muted (Tap for Sound)';
          audioBadge.style.borderColor = 'rgba(255, 255, 255, 0.2)';
        } else {
          audioBadge.innerText = '🔊 Sound On';
          audioBadge.style.borderColor = '#ffffff';
        }
      }

      audioBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        setMuteState(!isGlobalMuted);
      });

      // First user tap unlocks audio
      window.addEventListener('click', () => {
        if (isGlobalMuted) setMuteState(false);
      }, { once: true });
    </script>
  </body>
</html>
